:root{--forest:#193c30;--deep:#102e24;--lime:#d5ef80;--cream:#f7f8f3;--soft:#e7efdf;--line:#d9e2d3;color-scheme:light}

main{padding:23px 25px 75px}.head{display:flex;justify-content:space-between;align-items:baseline;gap:15px;margin-bottom:18px}.head small{color:#62786b}

:focus-visible{outline:3px solid #80aa59;outline-offset:2px}
@media(max-width:460px){header{padding:22px 16px}main{padding:15px}.toolbar{padding:10px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.art{min-height:160px}.art img{max-width:115px;max-height:145px}.info{padding:9px}.controls{gap:6px}.controls button{padding:9px 10px}}
