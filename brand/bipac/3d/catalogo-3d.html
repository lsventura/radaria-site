<script>
const items=JSON.parse(document.querySelector('#manifest').textContent);
const list=document.querySelector('#grid'),q=document.querySelector('#search'),cat=document.querySelector('#category');
for(const c of [...new Set(items.map(x=>x.category))]){const o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o)}
function render(){const query=q.value.trim().toLocaleLowerCase('pt-BR'),category=cat.value;list.replaceChildren();const rows=items.filter(x=>(!category||x.category===category)&&(x.slug+' '+x.title+' '+x.category).includes(query));document.querySelector('#count').textContent=rows.length+' de 200';
for(const x of rows){const card=document.createElement('article');card.className='card';const im=document.createElement('img');im.src=x.file;im.alt=x.title;im.loading='lazy';card.append(im);const title=document.createElement('strong');title.textContent=x.slug.replace(/-/g,' ');card.append(title);const subt=document.createElement('small');subt.textContent=x.category;card.append(subt);const a=document.createElement('a');a.href=x.file;a.download=x.file.split('/').pop();a.textContent='Baixar SVG';card.append(a);list.append(card)}}
q.addEventListener('input',render);cat.addEventListener('change',render);render();
</script></body></html>
